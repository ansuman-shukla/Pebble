# The castle town, authored in local metres.
#
# Origin = town centre, +x = east, +z = south (north is -z), ground at y = 0.
# rotation_deg is a yaw in {0, 90, 180, 270}: 0 faces south (+z), 90 east, 180 north, 270 west.
#
# placements: single props          {id, kind, at: [x, z], rotation_deg}
# runs:       straight axis-aligned  {id, kind, from, to}  segments spaced by the kind's footprint x
# tiles:      a rectangle filled     {id, kind, rect: [x0, z0, x1, z1]}  by the kind's footprint
# areas / water: ground polygons for rendering, given as `polygon` or `rect`.
# Kinds and their footprints live in kinds.yaml.

name: Castle town
extent: {min_x: -160, max_x: 160, min_z: -160, max_z: 160}
spawn: {at: [0, 120], heading_deg: 180} # on the approach road, facing the main gate

areas:
