  - {id: approach-road, kind: road, rect: [-3, 100, 3, 160]}
  - {id: west-gate-lane, kind: road, rect: [-108, 73, -97, 79]}
  - {id: west-gate-inner-lane, kind: road, rect: [-97, 64, -91, 79]}
  - {id: market, kind: plaza, rect: [10, 44, 30, 57]}
  - {id: temple-forecourt, kind: plaza, rect: [48, -68, 92, -50]}
  - {id: training-ground, kind: courtyard, rect: [-90, -90, -50, -50]}
  - {id: rice-fields, kind: field, rect: [-150, 18, -108, 98]}

water:
