  - {id: moat-road-n, kind: road, rect: [-43, -43, 43, -37]}
  - {id: moat-road-s, kind: road, rect: [-43, 37, 43, 43]}
  - {id: moat-road-w, kind: road, rect: [-43, -37, -37, 37]}
  - {id: moat-road-e, kind: road, rect: [37, -37, 43, 37]}
  - {id: main-street-n, kind: street, rect: [-3, 43, 3, 58]}
