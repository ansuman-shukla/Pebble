# Hotspots (10-world-v1 §1.2): named clusters of nodes in three rings around each settlement. `at` is the target
# [lat, lon] (the bible's table where it gives one); generation puts each hotspot at its target or the nearest cell
# within 150 m (2 km when its features need water: it follows the nearest water) where it keeps every rule: on land
# of one of its biomes, outside the town chart, reachable on foot, in its ring, min_spacing_m from the hotspots above
# it, with room for its features. `flora` counts are exact
# (natural flora of those kinds stays out of the hotspot);
# `features` are fixed nodes placed by rule; `paint` gives its land an authored biome like a site's; `called` is the
# name mid-sentence ("the path from Band A camp to the River marsh").

min_spacing_m: 40
rings: {home_m: 400, middle_m: 1000, far_m: 1200}
# each camp's home ring holds exactly these (10 §1.2 ring budget); nut trees stay out so foragers must travel
home_ring_flora: {berry_bush: 8, root_patch: 8, deadwood: 6, nut_tree: 0}

hotspots:
