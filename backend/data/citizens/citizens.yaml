# The v0 cast: 15 citizens (docs/design/04-minds.md roster; D7). The engine starts new runs with this file.
#
# site + at = where they start, in local metres (x east, z south) around the site's anchor (the town uses its chart).
# home      = a town house placement id (townhouse, farmhouse, castle-keep) or "<camp site>:<lean-to placement id>".
# look      = a look id from frontend/src/lib/world/citizen-looks.ts (sex follows the look's figure).
# skills    = what work(task) and later crafts need: farming, weaving, trade, arms, governing (town);
#             gathering, hunting, fire, healing (bands).
# knows_places / knows_people = starting knowledge (place ids from sites or data/town/places.yaml; citizen ids).

stores:
  store-2: {rice: 400, wood: 300} # the storehouses' stand: about six days of rice, firewood for the gate baskets

