# The World v1 cast: 22 citizens (docs/design/10-world-v1.md §3.1; D7, D129). The engine starts new runs with this file.
#
# site + at = where they start, in local metres (x east, z south) around the site's anchor (the town uses its chart).
# home      = a town house placement id (townhouse, farmhouse, castle-keep, temple-hall) or
#             "<camp site>:<lean-to placement id>"; the household chest by a town home is the placement "<home>-chest".
# look      = a look id from frontend/src/lib/world/citizen-looks.ts (sex follows the look's figure).
# role      = their job in words; brains/profile.py routes it to a routine by keyword.
# region    = their group (town, band_a, band_b).
# skills    = what work(task) and crafts need: farming, weaving, trade, arms, governing, smithing, digging (town);
#             gathering, hunting, fire, healing (bands and the monk).
# knows_places / knows_people = starting knowledge (place ids from sites or data/town/places.yaml; citizen ids).
# rank, titles = §3.2 (lord 5; samurai, monk, band leader 4; ashigaru, merchant, smith, elders 3; adults 2; children 1).
# traits    = honesty, generosity, boldness, temper (0-1).
# family    = kin by id: what that person is to this one ("aiko: mate" = Aiko is Genzo's mate); both sides agree.
# bonds     = how a pair feels about each other beyond kin (-100..100); when both of a pair give it, they agree.
# ambition  = in words, and the world checks that tell it is reached (all of them; app/sim/citizens.py lists them).
#             Arguments name things by id: store = a storehouse, "<home>-chest", the market stall, a field rack or
#             "<camp site>:drying-rack"; place = a site or town place; who, to = citizen ids; group = a region.
# coins     = starting purse in mon; with the keep's chest (the treasury) the town holds the whole supply of 3 000.

stores:
  store-2: {rice: 400, wood: 300} # the granary's stand: about six days of rice, firewood for the gate baskets

chests: # by home: the household chest's starting stock
  castle-keep: {coins: 2015} # the lord's treasury
