name: pebble

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5544}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pebble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pebble}
      POSTGRES_DB: ${POSTGRES_DB:-pebble}
    volumes:
      # backend/Makefile passes the resolved path, so every git worktree describes the same container.
      - ${PEBBLE_RUNTIME_DIR:-./.runtime}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
